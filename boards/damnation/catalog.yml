project: Revelation X
style:
  reference_image: mockup/board.png
  palette_size: 36
  prompt: dark macabre pixel art, gothic horror theme, deep red and gold accents on
    aged wood and stone, occult symbols, hand-painted shading
board_size:
- 1920
- 1080
centerpiece:
  bbox:
  - 700
  - 180
  - 1220
  - 900
  target_size:
  - 520
  - 720
  prompt: horned demon figure with glowing eyes, surrounded by stacks of gold coins
    and a small red roulette wheel, swirling smoke, ominous and theatrical
  needs_active: true
  active_kind: pulse
board_spaces:
  layout:
    top_row:
      count: 12
      start:
      - 0
      - 0
      axis: x
      size:
      - 160
      - 180
    bottom_row:
      count: 12
      start:
      - 0
      - 900
      axis: x
      size:
      - 160
      - 180
    left_col:
      count: 5
      start:
      - 0
      - 180
      axis: y
      size:
      - 180
      - 144
    right_col:
      count: 5
      start:
      - 1740
      - 180
      axis: y
      size:
      - 180
      - 144
  designs:
  - id: corner_jail
    prompt: JAIL board space, prison bars, skull motif, red corner banner
    positions:
    - bottom_row.0
  - id: corner_fail
    prompt: FAIL board space, broken sword, red corner banner
    positions:
    - bottom_row.11
  - id: corner_top_left
    prompt: decorative corner space, dark wood, gold trim, demonic sigil
    positions:
    - top_row.0
  - id: corner_top_right
    prompt: decorative corner space, dark wood, gold trim, mirrored sigil
    positions:
    - top_row.11
  - id: damnation_label
    prompt: DAMNATION header banner, red banner, gothic typeface, gold underline
    positions:
    - top_row.5
  - id: fate_label
    prompt: FATE header banner, parchment scroll, demonic sigil, red ribbon
    positions:
    - top_row.7
  - id: top_icon_a
    prompt: small board property tile, dark stone with carved demon face icon
    positions:
    - top_row.1
    - top_row.4
    - top_row.8
  - id: top_icon_b
    prompt: small board property tile, weathered wood with pentagram icon
    positions:
    - top_row.2
    - top_row.6
    - top_row.9
  - id: top_icon_c
    prompt: small board property tile, red marble with skull icon
    positions:
    - top_row.10
  - id: go_damnation
    prompt: GO DAMNATION arrow board space, red banner, ornate gold lettering
    positions:
    - bottom_row.5
  - id: jair_abail
    prompt: JAIR ABAIL board space, red banner, gothic gold letters
    positions:
    - bottom_row.6
  - id: community_chest
    prompt: COMMUNITY CHEST tile, ornate wooden chest with gold lock and chains
    positions:
    - bottom_row.9
  - id: bottom_icon_a
    prompt: small board property tile, dark stone with thorn-wreath icon
    positions:
    - bottom_row.1
    - bottom_row.4
  - id: bottom_icon_b
    prompt: small board property tile, weathered wood with crossed scythes
    positions:
    - bottom_row.2
    - bottom_row.10
  - id: bottom_icon_c
    prompt: small board property tile, red marble with horned helm icon
    positions:
    - bottom_row.3
    - bottom_row.8
  - id: side_property
    prompt: wide property tile, dark wood with brass rivets, occult sigil center
    positions:
    - left_col.0
    - left_col.1
    - left_col.3
    - left_col.4
    - right_col.1
    - right_col.2
    - right_col.3
  - id: battle_space_top_bottom
