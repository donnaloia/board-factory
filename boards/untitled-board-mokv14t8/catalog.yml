project: Untitled Board
version: 1
board_size:
- 1920
- 1080
style:
  reference_image: mockup/board.png
  palette_size: 24
  prompt: Dark fantasy theme with pixel-art style. Rich reds and blacks evoke a sinister
    mood.
board_spaces:
  layout:
    top_row:
      count: 12
      start:
      - 0
      - 0
      axis: x
      size:
      - 160
      - 180
    bottom_row:
      count: 12
      start:
      - 0
      - 900
      axis: x
      size:
      - 160
      - 180
    left_col:
      count: 5
      start:
      - 0
      - 180
      axis: y
      size:
      - 180
      - 144
    right_col:
      count: 5
      start:
      - 1740
      - 180
      axis: y
      size:
      - 180
      - 144
  designs:
  - id: corner_tl
    prompt: Fiery skeletal figure with a crown.
    positions:
    - top_row.0
  - id: corner_tr
    prompt: Mysterious cloaked figure with a scythe.
    positions:
    - top_row.11
  - id: corner_bl
    prompt: Animated flames surrounding a skull.
    positions:
    - bottom_row.0
  - id: corner_br
    prompt: Grinning demon face in shadow.
    positions:
    - bottom_row.11
  - id: top_banner_a
    prompt: Banner with 'DAMNATION' in ominous text.
    positions:
    - top_row.5
  - id: top_banner_b
    prompt: Banner with 'FATE' surrounded by dice.
    positions:
    - top_row.7
  - id: top_space_a
    prompt: Fiery cauldron with bubbling potion.
    positions:
    - top_row.1
    - top_row.4
    - top_row.8
  - id: top_space_b
    prompt: Pair of burning, enchanted dice.
    positions:
    - top_row.2
    - top_row.6
    - top_row.9
  - id: top_space_c
    prompt: Glowing crystal ball on stand.
    positions:
    - top_row.3
    - top_row.10
  - id: bottom_banner_a
    prompt: Banner with 'TO THE ABYSS' in red.
    positions:
    - bottom_row.5
  - id: bottom_banner_b
    prompt: Banner with 'DOOM' in gothic text.
    positions:
    - bottom_row.6
  - id: bottom_space_a
    prompt: Cage of bones with flames inside.
    positions:
    - bottom_row.1
    - bottom_row.4
  - id: bottom_space_b
    prompt: Evil tome with glowing insignia.
    positions:
    - bottom_row.2
    - bottom_row.10
  - id: bottom_space_c
    prompt: Ancient scroll with cryptic symbols.
    positions:
    - bottom_row.3
    - bottom_row.8
  - id: bottom_space_d
    prompt: Stacked skulls with eerie glow.
    positions:
    - bottom_row.9
  - id: bottom_battle
    prompt: Infernal pit with swirling flames.
    positions:
    - bottom_row.7
  - id: side_property
    prompt: Spooky haunted house in mist.
    positions:
    - left_col.0
    - left_col.1
    - left_col.3
    - left_col.4
    - right_col.1
    - right_col.2
    - right_col.3
  - id: side_battle
    prompt: Battlefield with clashing skeletons.
    positions:
    - left_col.2
    - right_col.0
    - right_col.4
