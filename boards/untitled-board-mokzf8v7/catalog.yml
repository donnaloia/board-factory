    prompt: Banner with 'FATE' in stylized script
    positions:
    - top_row.7
  - id: top_space_a
    prompt: Wicked candelabra, dark flames
    positions:
    - top_row.1
    - top_row.4
    - top_row.8
  - id: top_space_b
    prompt: Ancient tome, arcane glow
    positions:
    - top_row.2
    - top_row.6
    - top_row.9
  - id: top_space_c
    prompt: Mystical crystal ball, swirling mists
    positions:
    - top_row.3
    - top_row.10
  - id: bottom_banner_a
    prompt: Banner with 'ABYSS' in bold letters
    positions:
    - bottom_row.5
  - id: bottom_banner_b
    prompt: Banner with 'FAIL' in sinister font
    positions:
    - bottom_row.6
  - id: bottom_space_a
    prompt: Chained skeleton, eerie glow
