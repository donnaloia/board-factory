project: Damnation Board
version: 1
board_size:
- 1920
- 1080
style:
  reference_image: mockup/board.png
  palette_size: 24
  prompt: Dark fantasy theme with ominous undertones. Retro pixel art style, warm
    reds and browns.
centerpiece:
  bbox:
  - 700
  - 180
  - 1220
  - 900
  target_size:
  - 520
  - 720
  prompt: Demonic figure, surrounded by flames and gold
  needs_active: false
  active_kind: none
board_spaces:
  layout:
    top_row:
      count: 12
      start:
      - 0
      - 0
      axis: x
      size:
      - 160
      - 180
    bottom_row:
      count: 12
      start:
      - 0
      - 900
      axis: x
      size:
      - 160
      - 180
    left_col:
      count: 5
      start:
      - 0
      - 180
      axis: y
      size:
      - 180
      - 144
    right_col:
      count: 5
      start:
      - 1740
      - 180
      axis: y
      size:
      - 180
      - 144
  designs:
  - id: corner_tl
    prompt: Skull in flames, gothic style
    positions:
    - top_row.0
  - id: corner_tr
    prompt: Deck of cursed cards, dark
    positions:
    - top_row.11
  - id: corner_bl
    prompt: Haunted house silhouette, eerie
    positions:
    - bottom_row.0
  - id: corner_br
    prompt: Creepy gravestone, shadowy
    positions:
    - bottom_row.11
  - id: top_banner_a
    prompt: Banner with 'DAMNATION' in gothic font
    positions:
    - top_row.5
