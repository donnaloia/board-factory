<?xml version="1.0" encoding="UTF-8"?>
<!--
  Card Factory — layout schematic (reference skeleton, not a generated asset).
  Aspect 5:7 (portrait playing-card style). Regions match portrait-two-band-v1
  (tech-spec/card-factory/examples/layout-portrait-2_3-1_3.json).
  Inner hull is illustrative; real inner hull comes from committed frame metadata at runtime.
  Canonical pixels for this ratio: see app/domains/cards/canvas.py (e.g. 720×1008).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="490" viewBox="0 0 350 490" role="img" aria-labelledby="title desc">
  <title id="title">Card layout schematic — frame, art, stats</title>
  <desc id="desc">Five-by-seven portrait card with outer frame band, upper two-thirds illustration area, lower one-third procedural text band.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #1a1a1a; }
      .label-sm { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #444; }
      .band-art { fill: #cfe8ff; stroke: #2563eb; stroke-width: 2; }
      .band-stats { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .frame-band { fill: none; stroke: #737373; stroke-width: 3; }
      .inner-edge { fill: none; stroke: #171717; stroke-width: 2; stroke-dasharray: 6 4; }
      .dim { fill: #64748b; font-size: 10px; }
    ]]></style>
  </defs>

  <!-- Card outer edge -->
  <rect x="2" y="2" width="346" height="486" rx="12" ry="12" fill="#fafafa" stroke="#0f172a" stroke-width="3"/>

  <!-- Frame / border band (committed frame asset sits here; thickness not to scale with real art) -->
  <rect x="2" y="2" width="346" height="486" rx="12" ry="12" class="frame-band"/>
  <text x="175" y="20" text-anchor="middle" class="label-sm">Frame / border (committed PNG + alpha)</text>

  <!-- Inner hull — where interior_normalized rects apply -->
  <rect x="26" y="27" width="298" height="436" class="inner-edge" rx="4" ry="4"/>
  <text x="175" y="44" text-anchor="middle" class="dim">inner hull (from frame metadata)</text>

  <!-- Upper 2/3 illustration -->
  <rect x="26" y="27" width="298" height="291" class="band-art"/>
  <text x="175" y="165" text-anchor="middle" class="label">Illustration</text>
  <text x="175" y="183" text-anchor="middle" class="label-sm">masked AI generation · no frame in prompt</text>

  <!-- Lower 1/3 procedural stats -->
  <rect x="26" y="318" width="298" height="145" class="band-stats"/>
  <text x="175" y="385" text-anchor="middle" class="label">Stats / text panel</text>
  <text x="175" y="403" text-anchor="middle" class="label-sm">procedural type (e.g. Attack +1)</text>

  <!-- Dimension hint -->
  <text x="175" y="478" text-anchor="middle" class="dim">5 : 7 canvas · portrait-two-band-v1</text>
</svg>
