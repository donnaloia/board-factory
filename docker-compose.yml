# All Board Factory configuration lives in this file.
#
# Fill in your PIXELLAB_API_KEY below before your first `make up`.
# To use the mock provider (no API key needed) for testing the pipeline
# structure, leave the key blank and set BOARDFACTORY_PROVIDER: mock.
#
# To keep your keys out of git after editing, run once:
#   make protect-keys
#
# (To resume tracking changes later: `make unprotect-keys`.)

services:
  boardfactory-cli:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    working_dir: /repo
    volumes:
      - ./:/repo
    environment:
      # ─── Required (or set BOARDFACTORY_PROVIDER: mock to skip) ──────────────
      # Sign up at https://www.pixellab.ai
      PIXELLAB_API_KEY: ""

      # ─── Pipeline knobs ─────────────────────────────────────────────────────
      BOARDFACTORY_PROVIDER: pixellab        # pixellab | mock
      BOARDFACTORY_PALETTE_SIZE: "24"
      BOARDFACTORY_SPACE_CANDIDATES: "3"
      BOARDFACTORY_PANEL_CANDIDATES: "6"
      BOARDFACTORY_CENTERPIECE_CANDIDATES: "12"
      BOARDFACTORY_PROJECT_NAME: my-board

      # ─── Internal ───────────────────────────────────────────────────────────
      BOARDFACTORY_REPO: /repo

  review-ui:
    build:
      context: ./services/review-ui
      dockerfile: Dockerfile
    ports:
      - "8473:8473"
    volumes:
      - ./:/repo
    environment:
      # Inpainting needs the same API key as the pipeline.
      PIXELLAB_API_KEY: ""
      BOARDFACTORY_PROVIDER: pixellab
      BOARDFACTORY_REPO: /repo
