[project]
name = "boardfactory"
version = "0.1.0"
description = "Pixel-art board game asset pipeline (web-only library)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "pillow>=10.4,<12.0",
  "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Ships the boardfactory pipeline + the sibling space_animations pipeline.
# Each package is isolated (no cross-imports) per .cursorrules; this single
# pyproject is just the install manifest so `pip install -e /repo/pipeline`
# picks both up at once.
include = ["boardfactory*", "space_animations*", "cardfactory*", "tokenfactory*"]
